<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Admin Work Requests - FixMate</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container" style="padding: 2rem; max-width: 900px">
      <h2>Work Requests</h2>
      <p style="color: var(--muted)">
        View all user requests and their status.
      </p>
      <div style="display: flex; gap: 12px; margin-bottom: 15px">
        <select id="sortSelect" class="form-control" style="max-width: 180px">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>

        <select id="filterSelect" class="form-control" style="max-width: 200px">
          <option value="all">All Status</option>
          <option value="Pending">Pending</option>
          <option value="Assigned">Assigned</option>
          <option value="Accepted">Accepted</option>
          <option value="Completed">Completed</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <div id="workRequests"></div>
    </main>

    <script
      type="module"
      src="/assets/js/pages/admin/work-requests.js"
    ></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto("navbar-dynamic");
    </script>
  </body>
</html>
