<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Edit Admin Profile - FixMate</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <div id="navbar-dynamic"></div>

    <main class="container" style="max-width:500px; padding:2rem">
      <h2>Edit Profile</h2>

      <form id="editProfileForm">
        <div class="form-group">
          <label>Name</label>
          <input type="text" name="name" required class="form-control"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" required class="form-control"/>
        </div>
        <div class="form-group">
          <label>Password (leave blank to keep current)</label>
          <input type="password" name="password" class="form-control"/>
        </div>
        <div class="form-group">
          <label>Profile Picture</label>
          <input type="file" name="profilePic" class="form-control"/>
        </div>
        <button class="btn btn-primary" style="margin-top:1rem">Update</button>
        <p id="successMsg" style="color:green; margin-top:0.5rem"></p>
        <p id="errorMsg" style="color:red; margin-top:0.5rem"></p>
      </form>
    </main>

    <script type="module" src="/assets/js/pages/admin/profile.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto("navbar-dynamic");
    </script>
  </body>
</html>
