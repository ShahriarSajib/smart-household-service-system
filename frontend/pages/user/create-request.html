<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create Request - FixMate</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>
  <body>
    <div id="navbar-dynamic"></div>

    <main class="container" style="padding: 2rem 1rem; max-width: 900px">
      <h2>Create Service Request</h2>
      <p style="color: var(--muted)">
        Describe your issue and we'll match the best worker for you.
      </p>

      <form id="requestForm" style="margin-top: 1rem">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-control" name="category" required>
            <option value="">Select one</option>
            <option>Plumbing</option>
            <option>Electrician</option>
            <option>Cleaning</option>
            <option>AC Repair</option>
            <option>Painting</option>
          </select>
          <div class="form-error" style="display: none"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea
            class="form-control"
            name="description"
            rows="3"
            required
          ></textarea>
          <div class="form-error" style="display: none"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Location (text)</label>
          <input class="form-control" name="location" required />
          <div class="form-error"></div>
        </div>

        <!-- NEW: Latitude + Longitude Fields -->
        <div
          style="
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 1rem;
          "
        >
          <div style="flex: 1">
            <label class="form-label">Latitude</label>
            <input name="latitude" class="form-control" placeholder="23.7806" />
          </div>

          <div style="flex: 1">
            <label class="form-label">Longitude</label>
            <input
              name="longitude"
              class="form-control"
              placeholder="90.2794"
            />
          </div>

          <div>
            <button
              type="button"
              id="gpsBtn"
              class="btn btn-secondary"
              style="height: 40px; margin-top: 22px"
            >
              Use GPS
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top: 1rem">
          Submit Request
        </button>
      </form>

      <div id="message" style="margin-top: 1rem"></div>
    </main>

    <script
      type="module"
      src="/assets/js/pages/user/create-request.js"
    ></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  </body>
</html>
