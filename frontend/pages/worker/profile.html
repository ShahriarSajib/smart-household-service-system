<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Worker Profile - FixMate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/assets/css/global.css" />
  </head>

  <body>
    <div id="navbar-dynamic"></div>

    <main class="container" style="max-width: 500px; padding: 2rem">
      <h2>My Profile</h2>

      <div style="text-align: center; margin-bottom: 20px">
        <img
          id="profileImg"
          src="/assets/img/default-avatar.png"
          style="
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            cursor: pointer;
          "
        />
      </div>

      <!-- ========== FULLSCREEN IMAGE MODAL ========== -->
      <div id="imgModal" class="img-modal">
        <span class="img-modal-close">&times;</span>
        <img id="modalImg" src="" />
      </div>
      <!-- ============================================ -->

      <div class="card" style="padding: 20px">
        <p><b>Name:</b> <span id="name"></span></p>
        <p><b>Email:</b> <span id="email"></span></p>
        <p><b>Phone:</b> <span id="phone"></span></p>
        <p><b>Skill Category:</b> <span id="skill"></span></p>
      </div>

      <button
        id="updateBtn"
        class="btn btn-primary"
        style="margin-top: 20px; width: 100%"
      >
        Update Profile
      </button>
    </main>

    <script type="module" src="/assets/js/pages/worker/profile.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  </body>
</html>
