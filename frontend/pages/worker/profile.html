<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Worker Profile - FixMate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/assets/css/global.css" />
</head>

<body>
  <div id="navbar-dynamic"></div>

  <main class="container" style="max-width: 500px; padding: 2rem;">
    <h2>My Profile</h2>

    <div style="text-align: center; margin-bottom: 20px;">
      <img id="profileImg"
           src="/assets/img/default-avatar.png"
           style="width:130px; height:130px; border-radius:50%; object-fit:cover; border:3px solid var(--primary);" />
    </div>

    <form id="workerProfileForm">
      <label>Name</label>
      <input type="text" id="name" class="form-control" required />

      <label>Email</label>
      <input type="email" id="email" class="form-control" required />

      <label>Skill Category</label>
      <input type="text" id="skill_category" class="form-control" />

      <label>Profile Picture</label>
      <input type="file" id="profilePic" class="form-control" />

      <button id="submitBtn" class="btn btn-primary" style="margin-top: 15px;">
        Update Profile
      </button>
    </form>
  </main>

  <script type="module" src="/assets/js/pages/worker/profile.js"></script>
  <script type="module">
    import { renderNavbarInto } from "/assets/js/components/navbar.js";
    renderNavbarInto();
  </script>

</body>
</html>
