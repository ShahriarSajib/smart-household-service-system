<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Update Location</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/css/global.css">
</head>
<body>

<div id="navbar-dynamic"></div>

<main class="container" style="padding:2rem;max-width:900px">
  <h2>Update Your Location 📍</h2>
  <p style="color:var(--muted)">Your location helps users find nearby workers.</p>

  <button class="btn btn-primary" id="gpsBtn">Use GPS</button>

  <form id="locForm" style="margin-top:1.5rem">
    <div class="form-group">
      <label>Latitude</label>
      <input name="latitude" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Longitude</label>
      <input name="longitude" class="form-control" required>
    </div>

    <button class="btn btn-primary" style="margin-top:1rem">Update</button>
  </form>

  <div id="message" style="margin-top:1rem"></div>
</main>

<script type="module" src="/assets/js/pages/worker/update-location.js"></script>
<script type="module">
  import { renderNavbarInto } from "/assets/js/components/navbar.js";
  renderNavbarInto();
</script>

</body>
</html>
