<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FixMate — Home</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/animations.css" />
  </head>
  <body data-theme="dark">
    <div id="navbar-dynamic"></div>

    <main class="container" style="padding: 5rem 1rem">
      <section class="hero">
        <div class="hero-content">
          <h1 class="hero-title">
            Professional Home Services <br /><span class="gradient-text">
              At Your Fingertips
            </span>
          </h1>

          <p class="hero-subtitle">
            Connect with verified, rated professionals near you.
          </p>

          <div class="hero-cta" style="margin-top: 1.5rem">
            <a class="btn btn-primary" href="/pages/auth/register-user.html">
              Book a Service
            </a>
            <a
              class="btn btn-secondary"
              href="/pages/auth/register-worker.html"
            >
              Join as Worker
            </a>
          </div>

          <div style="margin-top: 2.2rem" class="hero-stats">
            <div class="stat">
              <div class="stat-number" data-target="500">0</div>
              <div class="stat-label">Active Workers</div>
            </div>
            <div class="stat">
              <div class="stat-number" data-target="2000">0</div>
              <div class="stat-label">Jobs Completed</div>
            </div>
            <div class="stat">
              <div class="stat-number" data-target="4.8">0</div>
              <div class="stat-label">Avg Rating</div>
            </div>
          </div>
        </div>

        <div class="hero-visual" aria-hidden="true">
          <div class="floating-card card-1">🔨 Carpentry</div>
          <div class="floating-card card-2">🔌 Electrical</div>
          <div class="floating-card card-3">🚰 Plumbing</div>
        </div>
      </section>
    </main>

    <footer class="footer" style="padding: 2rem 1rem">
      <div class="container">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div><strong>FixMate</strong> — 2025</div>

          <div style="display: flex; gap: 12px">
            <!-- Normal Login -->
            <a
              href="/pages/auth/login.html"
              class="btn btn-secondary"
              style="padding: 6px 14px"
            >
              Sign in
            </a>

            <!-- Login as Admin -->
            <a
              href="/pages/auth/login.html?as=admin"
              class="btn btn-primary"
              style="padding: 6px 14px"
            >
              Login as Admin
            </a>
          </div>
        </div>
      </div>
    </footer>

    <script type="module" src="/assets/js/pages/landing.js"></script>
    <script type="module">
      import { renderNavbarInto } from "/assets/js/components/navbar.js";
      renderNavbarInto();
    </script>
  </body>
</html>
